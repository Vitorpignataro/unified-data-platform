
services:
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

    networks:
      - data-network

  kafka-connect:
    image: quay.io/debezium/connect:3.6
    hostname: kafka-connect
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "127.0.0.1:8083:8083"

    environment:
      BOOTSTRAP_SERVERS: "kafka:19092"
      GROUP_ID: "udp-connect-cluster"

      CONNECT_CONFIG_PROVIDERS: "env"
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"

      CDC_MYSQL_A_USER: "${CDC_MYSQL_A_USER:?CDC_MYSQL_A_USER não definida}"
      CDC_MYSQL_A_PASSWORD: "${CDC_MYSQL_A_PASSWORD:?CDC_MYSQL_A_PASSWORD não definida}"

      CDC_MYSQL_B_USER: "${CDC_MYSQL_B_USER:?CDC_MYSQL_B_USER não definida}"
      CDC_MYSQL_B_PASSWORD: "${CDC_MYSQL_B_PASSWORD:?CDC_MYSQL_B_PASSWORD não definida}"

      CONFIG_STORAGE_TOPIC: "udp.connect.configs"
      OFFSET_STORAGE_TOPIC: "udp.connect.offsets"
      STATUS_STORAGE_TOPIC: "udp.connect.statuses"

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

      CONNECT_OFFSET_STORAGE_PARTITIONS: "3"
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"

      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

      REST_HOST_NAME: "0.0.0.0"
      ADVERTISED_HOST_NAME: "kafka-connect"

      HEAP_OPTS: "-Xms256m -Xmx768m"

    networks:
      - data-network

volumes:
  kafka_data:
